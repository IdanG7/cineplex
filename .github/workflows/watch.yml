name: Watch Odyssey tickets

on:
  schedule:
    # Every 15 minutes, deliberately off the boundary.
    #
    # This was */5 and produced one run in 75 minutes. Five minutes is the
    # shortest interval GitHub allows, and at that edge the scheduler drops
    # ticks rather than merely delaying them: the single run we did get
    # arrived at 02:54:01, which is the 02:50 tick four minutes late.
    #
    # :00 is also the busiest minute of the hour, so every */5 tick competed
    # with every other repo on the platform. Asking for less, at minutes
    # nobody else picks, is far likelier to actually be honoured. The
    # external cron in SETUP-CRON.md carries the 5-minute resolution; this is
    # the backstop, and a backstop that runs beats one that does not.
    - cron: "7,22,37,52 * * * *"
  # Escape hatch for GitHub's scheduler, which did not fire once in the first
  # hour on this repo. Any external cron can POST to the repository_dispatch
  # API with {"event_type": "poll"} and drive the watcher directly.
  repository_dispatch:
    types: [poll]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options: [check, probe, test-notify, dry-run, rehearse]

concurrency:
  group: cineplex-watch
  # A poller wants the freshest reading, never a backlog of stale ones. With
  # queueing, one run that cannot get a hosted runner sits there for fifteen
  # minutes and every poll behind it either waits or gets evicted -- which is
  # exactly what happened at a one-minute cadence. Superseding instead means a
  # stuck run costs one poll rather than fifteen.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # The external cron polls every minute, and the concurrency group keeps at
    # most one run pending: a job that hangs therefore blocks every poll behind
    # it until it times out. Three minutes caps that damage at three missed
    # polls. The watcher itself takes about two seconds.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # No setup-python step: ubuntu-latest ships 3.12 already and the watcher
      # has no dependencies. Provisioning a second copy cost 10-20s of a
      # 60-second budget to change nothing.

      - name: Run watcher
        env:
          # Accept either a secret or a repository variable, so the watcher
          # works whichever tab these were set under. Secrets win when both
          # exist. Note that variables are NOT masked in workflow logs, and
          # this repo is public -- see the README before using one.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || vars.WEBHOOK_URL }}
          CINEPLEX_API_KEY: ${{ secrets.CINEPLEX_API_KEY || vars.CINEPLEX_API_KEY }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            probe)       python3 cineplex_watch.py --probe ;;
            test-notify) python3 cineplex_watch.py --test-notify ;;
            dry-run)     python3 cineplex_watch.py --dry-run ;;
            rehearse)    python3 cineplex_watch.py --rehearse ;;
            *)           python3 cineplex_watch.py ;;
          esac

      - name: Record which showtimes were already reported
        # Every non-manual trigger is a real check and must record what it
        # alerted on; without this a repository_dispatch run would re-send the
        # same showtimes every few minutes forever.
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'check'
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "cineplex-watcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "watcher: record newly alerted showtimes"
            # The scheduled job runs every few minutes; another run may have
            # pushed in between. Rebase and retry rather than failing the run.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 3))
            done
          else
            echo "No state change."
          fi
