name: Watch Odyssey tickets

on:
  schedule:
    # Every 5 minutes. GitHub delays scheduled runs under load, so treat this
    # as "roughly every 5-15 minutes" rather than a guarantee.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options: [check, probe, test-notify, dry-run]

concurrency:
  group: cineplex-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CINEPLEX_API_KEY: ${{ secrets.CINEPLEX_API_KEY }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            probe)       python cineplex_watch.py --probe ;;
            test-notify) python cineplex_watch.py --test-notify ;;
            dry-run)     python cineplex_watch.py --dry-run ;;
            *)           python cineplex_watch.py ;;
          esac

      - name: Record which showtimes were already reported
        if: github.event_name == 'schedule' || inputs.mode == 'check'
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "cineplex-watcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "watcher: record newly alerted showtimes"
            # The scheduled job runs every few minutes; another run may have
            # pushed in between. Rebase and retry rather than failing the run.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 3))
            done
          else
            echo "No state change."
          fi
